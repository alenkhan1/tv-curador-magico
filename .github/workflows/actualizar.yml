name: Curador Automatico

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      presupuesto_min:
        description: "Minutos maximos de trabajo antes de guardar y parar"
        required: false
        default: "240"
      hilos:
        description: "Consultas simultaneas a TMDB"
        required: false
        default: "12"

concurrency:
  group: curador
  cancel-in-progress: false

jobs:
  procesar_catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restaurar cache de TMDB
        uses: actions/cache@v4
        with:
          path: cache_tmdb.json.gz
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-cache-

      - name: Instalar dependencias
        run: pip install --upgrade requests curl_cffi

      - name: Ejecutar el curador
        id: curador
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          PRESUPUESTO_MIN: ${{ github.event.inputs.presupuesto_min || '240' }}
          HILOS_TMDB: ${{ github.event.inputs.hilos || '12' }}
          UMBRAL_ALERTA_NO_IDENTIFICADO: "15"
          PYTHONUNBUFFERED: "1"
        run: python curador.py

      - name: Guardar cambios en el repositorio
        if: always()
        run: |
          git config --global user.name "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"
          if [ -f "cache_tmdb.json.gz" ] && [ -f "cache_tmdb.json" ]; then
            git rm -f --ignore-unmatch cache_tmdb.json
          fi
          for f in catalogo_curado.json cache_tmdb.json.gz correcciones.json informe_no_resueltos.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "Actualizacion del catalogo $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          for intento in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              echo "Cambios publicados."
              exit 0
            fi
            echo "Reintento $intento de publicacion..."
            sleep 10
          done
          echo "No se pudo publicar los cambios."
          exit 1

      - name: Resumen de lo no resuelto
        if: always()
        id: resumen_informe
        run: |
          test -f informe_no_resueltos.json || exit 0
          python -c "
          import json, os
          d = json.load(open('informe_no_resueltos.json', encoding='utf-8'))
          r = d.get('resumen', {})
          print('No resueltos:', r.get('total'))
          print('Por motivo:', r.get('por_motivo'))
          print('Patrones mas repetidos:')
          for p in (d.get('patrones') or [])[:8]:
              print('  %-24s %s veces' % (p.get('patron'), p.get('veces')))
          alerta = r.get('alerta') or {}
          print()
          print('Alerta de identificacion (umbral %s%%):' % alerta.get('umbral'))
          print('  peliculas sin identificar: %s%%' % alerta.get('porcentaje_peliculas'))
          print('  series sin identificar:    %s%%' % alerta.get('porcentaje_series'))
          salida = os.environ.get('GITHUB_OUTPUT')
          if salida:
              with open(salida, 'a', encoding='utf-8') as f:
                  f.write('supera_umbral=%s\n' % str(bool(alerta.get('supera_umbral'))).lower())
          "

      - name: Alertar si sube el porcentaje sin identificar
        if: always() && steps.resumen_informe.outputs.supera_umbral == 'true'
        run: |
          echo "::warning::El porcentaje de titulos sin identificar supero el umbral configurado. Revisa informe_no_resueltos.json (seccion 'patrones')."

      - name: Marcar fallo si el curador no valido el catalogo
        if: steps.curador.outcome == 'failure'
        run: |
          echo "El curador no publico un catalogo valido. Revisa el registro de arriba."
          exit 1
