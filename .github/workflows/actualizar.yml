name: Curador Automatico

on:
  schedule:
    - cron: "0 */4 * * *" # Ejecución cada 4 horas para mantener eventos frescos
  workflow_dispatch:

jobs:
  procesar_catalogo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el Curador de VOD (Películas/Series)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python curador.py

      - name: Ejecutar el Curador de Eventos Deportivos
        env:
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python curador_eventos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"
          git add catalogo_curado.json eventos_hoy.json
          git commit -m "Actualización automática: VOD y Eventos Deportivos" || echo "Sin cambios para guardar"
          git push
