name: Curador Eventos Deportivos

on:
  schedule:
    - cron: "0 */6 * * *"   # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:         # Permite ejecución manual desde GitHub Actions

jobs:
  procesar_eventos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Curador de Eventos
        env:
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY_2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY_3 }}
          XTREAM_URL:     ${{ secrets.XTREAM_URL }}
          XTREAM_USER:    ${{ secrets.XTREAM_USER }}
          XTREAM_PASS:    ${{ secrets.XTREAM_PASS }}
        run: python curador_eventos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name  "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"

          # CORRECCIÓN: pull --rebase ANTES del commit para evitar conflictos
          git pull --rebase origin main

          # Añadimos los archivos generados
          git add eventos_hoy.json
          git add meta_curador.json     || true
          git add eventos_raw_backup.json || true

          # Solo commiteamos si hay cambios reales
          git diff --staged --quiet || git commit -m "🤖 Curación automática de eventos [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          git push
