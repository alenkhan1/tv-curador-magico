name: Actualizar cartelera deportiva

on:
  schedule:
    # Actualiza cada cuatro horas. GitHub puede demorar tareas programadas en
    # horas de alta carga; workflow_dispatch permite forzar una actualización.
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:

concurrency:
  group: actualizar-cartelera-deportiva
  cancel-in-progress: false

jobs:
  procesar_eventos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip requests

      - name: Ejecutar curador base
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          # Cree este secreto para usar una clave propia; si queda vacío, el
          # script aplica la clave de desarrollo 123 con cadencia segura.
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          # Si usa otro puente, créelo como secreto. El valor por defecto del
          # script se aplica cuando este campo queda vacío.
          PUENTE_URL: ${{ secrets.PUENTE_URL }}
          APP_TIMEZONE: America/Bogota
          THESPORTSDB_MIN_INTERVAL: "2.1"
          HORAS_CACHE: "3"
          MAX_CUARENTENA: "1000"
          LOG_LEVEL: INFO
        run: python curador_eventos.py

      - name: Enriquecer con EPG lineal verificable
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          PUENTE_URL: ${{ secrets.PUENTE_URL }}
          APP_TIMEZONE: America/Bogota
          THESPORTSDB_MIN_INTERVAL: "2.1"
          HORAS_CACHE: "3"
          # true conserva emisiones deportivas explícitamente en vivo que no
          # aparecen en la agenda oficial, siempre marcadas como "probable".
          INCLUIR_EPG_NO_VERIFICADO: "true"
          MAX_EPG_EVENTOS: "150"
          LOG_LEVEL: INFO
        run: python inyector_epg.py

      - name: Resumen de curación
        if: always()
        run: |
          echo "## Curación deportiva" >> "$GITHUB_STEP_SUMMARY"
          if [ -f meta_curador.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat meta_curador.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó meta_curador.json." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar cartelera y diagnóstico
        if: success()
        run: |
          git config --global user.name "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"
          git add eventos_hoy.json eventos_descartados.json meta_curador.json
          git add agenda_api_v9.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Actualización de cartelera deportiva"
          git pull --rebase origin main
          git push origin HEAD:main
