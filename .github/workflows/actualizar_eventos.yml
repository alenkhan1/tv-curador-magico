name: Curador Eventos Deportivos

on:
  schedule:
    # Ejecuciones en UTC: 01:00, 07:00, 13:00, 19:00
    # → En Colombia (UTC-5): 20:00 día anterior, 02:00, 08:00, 14:00
    # Ajustado para cubrir partidos de mañana, mediodía y noche
    - cron: '0 1 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions

jobs:
  procesar_eventos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Curador de Eventos
        env:
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY3 }}
          XTREAM_URL:  ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python curador_eventos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name  "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"

          # Stagear archivos generados
          git add eventos_hoy.json
          git add meta_curador.json        || true
          git add eventos_raw_backup.json  || true

          # Commitear solo si hay cambios reales
          git diff --staged --quiet || \
            git commit -m "Curación automática $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Pull + push
          git pull --rebase origin main
          git push
