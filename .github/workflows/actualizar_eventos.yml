name: Curador Eventos Deportivos

on:
  schedule:
    # 3 ejecuciones diarias en UTC, espaciadas ~8 horas, para cubrir bien
    # tanto la zona horaria de Colombia (UTC-5) como la de España (CEST UTC+2)
    # y capturar sesiones de Eurosport que se confirman/actualizan mas tarde
    # en el dia (ej. sesiones de tarde/noche europeas).
    - cron: "0 6 * * *"   # 06:00 UTC -> 01:00 Colombia / 08:00 España
    - cron: "0 14 * * *"  # 14:00 UTC -> 09:00 Colombia / 16:00 España
    - cron: "0 21 * * *"  # 21:00 UTC -> 16:00 Colombia / 23:00 España
  workflow_dispatch:

jobs:
  procesar_eventos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Curador Base (TheSportsDB + Xtream)
        env:
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY_2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY_3 }}
          RAPIDAPI_KEY_4: ${{ secrets.RAPIDAPI_KEY_4 }}
          RAPIDAPI_KEY_5: ${{ secrets.RAPIDAPI_KEY_5 }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python curador_eventos.py

      - name: Ejecutar Inyector Eurosport (EPG_dobleM, sin Google)
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python inyector_epg.py

      - name: Guardar cambios Eventos
        run: |
          git config --global user.name "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"

          git add eventos_hoy.json

          if [ -f "meta_curador.json" ]; then
            git add meta_curador.json
          fi

          git commit -m "Actualización de Eventos" || echo "Sin cambios"
          git pull --rebase
          git push
