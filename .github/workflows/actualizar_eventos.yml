name: Curador Eventos Deportivos

on:
  schedule:
    # El Curador Pesado: 1 vez al día (17:00 UTC)
    - cron: "0 17 * * *"
    # El Inyector Ligero: Múltiples veces (13:00, 20:00, 23:00 UTC)
    - cron: "0 13,20,23 * * *"
  workflow_dispatch:

jobs:
  procesar_eventos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        # Además de requests, puedes agregar bs4 si llegas a usar BeautifulSoup en el futuro
        run: pip install requests

      - name: Ejecutar Curador Pesado (SofaScore)
        # ESTA ES LA MAGIA: Solo se ejecuta a las 17:00 o si le das clic manual al botón (workflow_dispatch)
        if: github.event.schedule == '0 17 * * *' || github.event_name == 'workflow_dispatch'
        env:
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY_2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY_3 }}
          RAPIDAPI_KEY_4: ${{ secrets.RAPIDAPI_KEY_4 }}
          RAPIDAPI_KEY_5: ${{ secrets.RAPIDAPI_KEY_5 }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python curador_eventos.py

      - name: Ejecutar Inyector Ligero (Scraping Web Local)
        # Este NO tiene "if", por lo que se ejecutará SIEMPRE (a las 13, 17, 20 y 23)
        # A las 17:00, inyectará los canales en el JSON nuevo. En los demás horarios, solo lo actualizará.
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python inyector_epg.py

      - name: Guardar cambios Eventos
        run: |
          git config --global user.name "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"
          
          # 1. Agrega eventos_hoy.json sí o sí
          git add eventos_hoy.json
          
          # 2. Agrega meta_curador.json SOLO si existe
          if [ -f "meta_curador.json" ]; then
            git add meta_curador.json
          fi
          
          git commit -m "Actualización de Eventos (Auto optimizado)" || echo "Sin cambios"
          git pull --rebase
          git push
