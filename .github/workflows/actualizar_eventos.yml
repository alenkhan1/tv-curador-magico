name: Actualizar cartelera deportiva multideporte

on:
  schedule:
    # Ejecución periódica para mantener la cartelera actualizada
    - cron: "0 5,9,13,16,19,22 * * *"
  workflow_dispatch:

concurrency:
  group: actualizar-cartelera-deportiva
  cancel-in-progress: false

jobs:
  procesar_eventos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias HTTP
        run: python -m pip install --disable-pip-version-check requests curl_cffi

      - name: Obtener fecha actual para cache diaria
        id: fecha_cache
        run: echo "fecha=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restaurar cache diaria de canales Xtream
        uses: actions/cache@v4
        with:
          path: canales_xtream_cache.json
          key: canales-xtream-${{ steps.fecha_cache.outputs.fecha }}

      - name: Construir agenda y curar streams con IA
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          PUENTE_URL: ${{ secrets.PUENTE_URL || 'https://zapdashboard.onrender.com/api/puente_xtream' }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          APP_TIMEZONE: America/Bogota
          API_SPORTS_MIN_INTERVAL: "7"
          API_SPORTS_MAX_RETRIES: "1"
          API_SPORTS_DEPORTES: football,basketball,baseball,formula-1,hockey,mma,nba,nfl,rugby,volleyball,handball,afl
          MINUTOS_CACHE: "1440"
          MAX_DIFERENCIA_MIN: "180"
          PUBLICAR_XTREAM_PROBABLE: "true"
          PUBLICAR_AGENDA_SIN_FUENTE: "false"
          USAR_THESPORTSDB_RESPALDO: "true"
          THESPORTSDB_MAX_EVENTOS: "3"
          THESPORTSDB_MAX_SOLICITUDES_DIA: "3"
          MAX_CUARENTENA: "1000"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_LEVEL: INFO
        run: python curador_eventos.py

      - name: Inyectar canales lineales deportivos seleccionados
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          PUENTE_URL: ${{ secrets.PUENTE_URL || 'https://zapdashboard.onrender.com/api/puente_xtream' }}
          APP_TIMEZONE: America/Bogota
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_LEVEL: INFO
        run: python inyector_canales_lineales.py

      - name: Resumen operativo
        if: always()
        run: |
          echo "## Curación deportiva multideporte" >> "$GITHUB_STEP_SUMMARY"
          for archivo in meta_curador.json eventos_hoy.json eventos_descartados.json; do
            if [ -f "$archivo" ]; then
              echo "### $archivo" >> "$GITHUB_STEP_SUMMARY"
              if [ "$archivo" = "meta_curador.json" ]; then
                echo '```json' >> "$GITHUB_STEP_SUMMARY"
                cat "$archivo" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Entradas con id: $(grep -c '"id"' "$archivo" || true)" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

      - name: Publicar cartelera, caché y diagnóstico
        if: success()
        run: |
          git config --global user.name "Bot Curador"
          git config --global user.email "bot@allstreamtv.com"
          for archivo in eventos_hoy.json eventos_descartados.json meta_curador.json agenda_api_actual.json agenda_api_ayer.json presupuesto_api.json logos_cache.json cache_gemini_deportes.json; do
            [ -f "$archivo" ] && git add "$archivo"
          done
          git diff --cached --quiet && exit 0
          git commit -m "Actualización inteligente de cartelera deportiva"
          git pull --rebase origin main
          git push origin HEAD:main
