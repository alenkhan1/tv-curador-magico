name: Prueba Piloto WebGrab+Plus

on:
  workflow_dispatch:

jobs:
  probar_scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR (Bypass toomanyrequests)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar WebGrab+Plus (Scraper)
        run: |
          echo "1. Arrancando contenedor en segundo plano..."
          docker run -d --name wgp \
            -v ${{ github.workspace }}/wgp_config:/config \
            ghcr.io/linuxserver/webgrabplus:latest

          echo "2. Esperando a que el entorno cargue..."
          sleep 10

          echo "3. Bypassing Internet Check y lanzando extracción..."
          docker exec wgp /bin/sh -c '
            echo "#!/bin/sh" > /bin/ping
            echo "exit 0" >> /bin/ping
            chmod +x /bin/ping
            
            DOTNET_BIN=$(find /app -name dotnet -type f | head -n 1)
            WG_DLL=$(find /app -name "WebGrab+Plus.dll" -type f | head -n 1)
            
            "$DOTNET_BIN" "$WG_DLL" /config
          '

          echo "4. Apagando y limpiando contenedor..."
          docker rm -f wgp

      - name: Mostrar el resultado generado
        run: |
          echo "=== LECTURA DEL ARCHIVO GUIDE.XML ==="
          cat wgp_config/guide.xml
