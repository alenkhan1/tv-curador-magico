name: Prueba Piloto WebGrab+Plus

on:
  workflow_dispatch: # Esto habilita el botón para ejecutarlo manualmente

jobs:
  probar_scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Ejecutar WebGrab+Plus (Scraper)
        run: |
          echo "1. Arrancando contenedor en segundo plano..."
          docker run -d --name wgp \
            -v ${{ github.workspace }}/wgp_config:/config \
            ghcr.io/linuxserver/webgrabplus:latest

          echo "2. Esperando 15s para que inicie su entorno nativo..."
          sleep 15

          echo "3. Lanzando la extracción manualmente..."
          docker exec wgp /bin/sh -c "cd /app/wg++ && dotnet WebGrab+Plus.dll /config"

          echo "4. Apagando y limpiando contenedor..."
          docker rm -f wgp

      - name: Mostrar el resultado generado
        run: |
          echo "=== LECTURA DEL ARCHIVO GUIDE.XML ==="
          cat wgp_config/guide.xml
